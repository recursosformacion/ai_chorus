[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chorus"
version = "0.15.0"
description = "Chorus API and personal music workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pymysql>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "sqlparse>=0.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m unit -ra"
markers = [
    "unit: tests sin base de datos (rápidos, default)",
    "integration: tests que requieren MariaDB 10.4.32 real (osap_chorus_test)",
    "migrations: tests de migraciones específicamente",
]

[tool.setuptools.packages.find]
include = ["app*"]