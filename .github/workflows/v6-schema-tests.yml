name: V6 schema tests

on:
  push:
    paths:
      - "migrations/sqlite/**"
      - "tests/test_v6_schema.py"
      - ".github/workflows/v6-schema-tests.yml"
  pull_request:
    paths:
      - "migrations/sqlite/**"
      - "tests/test_v6_schema.py"
      - ".github/workflows/v6-schema-tests.yml"
  workflow_dispatch:

jobs:
  sqlite-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run V6 schema integrity tests
        run: python -m pytest -q tests/test_v6_schema.py
