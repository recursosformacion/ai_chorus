name: Chorus API and V6 tests

on:
  push:
    paths:
      - "app/**"
      - "migrations/sqlite/**"
      - "tests/**"
      - "pyproject.toml"
      - "osap.toml.example"
      - "docs/**"
      - ".github/workflows/v6-schema-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "migrations/sqlite/**"
      - "tests/**"
      - "pyproject.toml"
      - "osap.toml.example"
      - "docs/**"
      - ".github/workflows/v6-schema-tests.yml"
  workflow_dispatch:

jobs:
  chorus-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chorus and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run complete test suite
        run: python -m pytest -q
