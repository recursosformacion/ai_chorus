name: Test Suite

# La integración y las migraciones se prueban sobre MariaDB 10.4 en contenedor.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (sin BD)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run unit tests
        run: pytest -m unit -x -q
        # Sin CHORUS_DATABASE_URL → estos tests usan SQLite en tmp_path

  integration-tests:
    name: Integration Tests (MariaDB 10.4 en contenedor)
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.4.34
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: osap_chorus_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=10
    env:
      TEST_DB: osap_chorus_test
      TEST_USER: osap2027_test
      TEST_PASS: testpass
      CHORUS_DATABASE_URL: mysql+pymysql://osap2027_test:testpass@127.0.0.1:3306/osap_chorus_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Provision least-privilege test user
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(
              host="127.0.0.1", user="root", password="rootpass",
              database="osap_chorus_test", autocommit=True,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "CREATE USER IF NOT EXISTS 'osap2027_test'@'%' IDENTIFIED BY 'testpass'"
                  )
                  cursor.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER, REFERENCES "
                      "ON `osap_chorus_test`.* TO 'osap2027_test'@'%'"
                  )
                  cursor.execute("FLUSH PRIVILEGES")
          finally:
              connection.close()
          PY
      - name: Rebuild test database
        run: python scripts/rebuild_test_db.py
      - name: Run integration tests
        run: pytest -m integration -x -v

  migration-tests:
    name: Migration Tests (MariaDB 10.4 en contenedor)
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.4.34
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: osap_chorus_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=10
    env:
      TEST_DB: osap_chorus_test
      TEST_USER: osap2027_test
      TEST_PASS: testpass
      CHORUS_DATABASE_URL: mysql+pymysql://osap2027_test:testpass@127.0.0.1:3306/osap_chorus_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Provision least-privilege test user
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(
              host="127.0.0.1", user="root", password="rootpass",
              database="osap_chorus_test", autocommit=True,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "CREATE USER IF NOT EXISTS 'osap2027_test'@'%' IDENTIFIED BY 'testpass'"
                  )
                  cursor.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER, REFERENCES "
                      "ON `osap_chorus_test`.* TO 'osap2027_test'@'%'"
                  )
                  cursor.execute("FLUSH PRIVILEGES")
          finally:
              connection.close()
          PY
      - name: Rebuild test database
        run: python scripts/rebuild_test_db.py
      - name: Run migration tests
        run: pytest -m migrations -x -v
