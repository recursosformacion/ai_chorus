name: Test Suite

# MariaDB se instala y arranca de forma nativa en el runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (sin BD)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run unit tests
        run: pytest -m unit -x -q
        # Sin CHORUS_DATABASE_URL → estos tests usan SQLite en tmp_path

  integration-tests:
    name: Integration Tests (MariaDB 10.4 nativo)
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.4.34
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: osap_chorus_test
          MYSQL_USER: osap2027_test
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=10
    env:
      TEST_DB: osap_chorus_test
      TEST_USER: osap2027_test
      TEST_PASS: testpass
      CHORUS_DATABASE_URL: mysql+pymysql://osap2027_test:testpass@127.0.0.1:3306/osap_chorus_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Rebuild test database
        run: python scripts/rebuild_test_db.py
      - name: Run integration tests
        run: pytest -m integration -x -v

  migration-tests:
    name: Migration Tests (MariaDB 10.4 nativo)
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.4.34
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: osap_chorus_test
          MYSQL_USER: osap2027_test
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=10
    env:
      TEST_DB: osap_chorus_test
      TEST_USER: osap2027_test
      TEST_PASS: testpass
      CHORUS_DATABASE_URL: mysql+pymysql://osap2027_test:testpass@127.0.0.1:3306/osap_chorus_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Rebuild test database
        run: python scripts/rebuild_test_db.py
      - name: Run migration tests
        run: pytest -m migrations -x -v
